name: GridMind browser UI preview

on:
  push:
    branches:
      - feat/phase3-ui-ux-transformation
    paths:
      - "frontend/**"
      - ".github/workflows/ui-browser-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-preview:
    name: Build standalone browser preview
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build standalone HTML preview
        run: npm run build:preview
      - name: Publish temporary draft preview
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ui-preview
          name: GridMind UI Preview
          body: |
            Temporary standalone browser preview for reviewing the Phase 3A design system.
            Download GridMind-UI-Preview.html and open it in a browser. No installation is required.
            This preview does not connect to the Python simulation engine.
          draft: true
          prerelease: true
          make_latest: false
          files: frontend/preview-dist/GridMind-UI-Preview.html
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
