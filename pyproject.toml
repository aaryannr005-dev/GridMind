[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridmind"
version = "0.1.0"
description = "Energy simulation, optimization, reporting, and public data tools for GridMind"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GridMind contributors" }]
dependencies = ["tzdata>=2024.1"]

[project.optional-dependencies]
test = ["pytest>=7"]
dashboard = ["streamlit>=1.65,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
